<form id="paper-form" onsubmit="return goToPaper(event)">
    <label for="paper-input" class="visually-hidden">arXiv ID or URL</label>
    <input
        type="text"
        id="paper-input"
        placeholder="Enter arXiv ID (e.g., 1706.03762) or URL"
        autocomplete="off"
    >
    <button type="submit">Start Chat</button>
</form>
