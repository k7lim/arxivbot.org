<form id="paper-form" onsubmit="return goToPaper(event)">
    <label for="paper-input" class="visually-hidden">arXiv ID or URL</label>
    <input
        type="text"
        id="paper-input"
        placeholder="arXiv link or ID, e.g. 1706.03762"
        autocomplete="off"
    >
    <button type="submit">Open paper</button>
</form>
