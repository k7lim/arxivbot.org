# fly.toml app configuration file generated for arxivbot on 2026-01-31T22:41:51-10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arxivbot'
primary_region = 'sjc'

[build]

[env]
  DATABASE_PATH = '/data/arxivbot.db'

[[mounts]]
  source = 'arxivbot_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
