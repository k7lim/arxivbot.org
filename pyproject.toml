[project]
name = "arxivbot"
version = "0.1.0"
description = "Chat with arXiv papers using paper-qa"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "paper-qa[qdrant]>=5",
    "qdrant-client>=1.7",
    "litellm>=1.30",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.19",
    "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxivbot"]
